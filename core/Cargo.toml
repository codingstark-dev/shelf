[package]
name = "shelf-core"
version = "0.1.0"
edition = "2024"

[dependencies]
age = "0.12"
anyhow = "1"
base64 = "0.22"
futures = "0.3"
http = "1"
keyring = { version = "3", features = ["apple-native"] }
notify-debouncer-full = "0.7.0"
object_store = { version = "0.12", features = ["aws"] }
open = "5"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "net", "fs", "io-util", "macros", "time", "sync"] }
trash = "5.2.9"
unicode-normalization = "0.1"

[dev-dependencies]
tempfile = "3"
